name: Quotey
options:
  bundleIdPrefix: com.quotey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Quotey:
    type: application
    platform: iOS
    sources:
      - path: Quotey
    resources:
      - path: Quotey/Resources
        optional: true
    info:
      path: Quotey/Info.plist
      properties:
        CFBundleDisplayName: Quotey
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Quotey uses the camera to scan text from pages so you can capture quotes without typing."
        NSPhotoLibraryUsageDescription: "Quotey reads text from photos of pages so you can capture quotes without typing."
    entitlements:
      path: Quotey/Quotey.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.quotey.shared
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.quotey.app
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.quotey.app"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quotey.app
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: QuoteyShare

  QuoteyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: QuoteyShare
    info:
      path: QuoteyShare/Info.plist
      properties:
        CFBundleDisplayName: Quotey
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      path: QuoteyShare/QuoteyShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.quotey.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quotey.app.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  QuoteyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuoteyTests
    dependencies:
      - target: Quotey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quotey.app.tests
        GENERATE_INFOPLIST_FILE: YES
